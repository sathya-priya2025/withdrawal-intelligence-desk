<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cybercrime Complaint Prediction</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d1622;
            color: #ffffff;
        }

        .main {
            max-width: 900px;
            margin: auto;
            padding: 45px 25px;
        }

        .subtitle {
            color: #e1aa3e;
            font-size: 20px;
            margin-bottom: 25px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 48px;
            line-height: 1.15;
            margin: 0 0 25px;
        }

        .intro {
            color: #a8b4c5;
            font-size: 21px;
            line-height: 1.6;
        }

        .line {
            border: 0;
            border-top: 2px solid #243447;
            margin: 35px 0;
        }

        .card,
        .prediction {
            background: #152333;
            border: 2px solid #263b50;
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 35px;
        }

        .card h2,
        .prediction h2 {
            font-family: Georgia, serif;
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 40px;
        }

        label {
            display: block;
            color: #aebaca;
            font-size: 19px;
            margin-bottom: 10px;
        }

        select,
        textarea,
        input {
            width: 100%;
            background: #1c2c3e;
            color: white;
            border: 2px solid #293e54;
            border-radius: 8px;
            padding: 15px;
            font-size: 18px;
            outline: none;
        }

        select {
            height: 55px;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        input {
            height: 55px;
        }

        .field {
            margin-bottom: 25px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .predict-btn {
            width: 100%;
            padding: 18px;
            background: #e1aa3e;
            color: #111111;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .predict-btn:hover {
            background: #f0bb50;
        }

        #result {
            color: #aebaca;
            font-size: 20px;
            line-height: 1.7;
        }

        .result-box {
            background: #1c2c3e;
            border-radius: 8px;
            padding: 20px;
            color: white;
            font-size: 19px;
        }

        @media (max-width: 600px) {

            .main {
                padding: 35px 20px;
            }

            h1 {
                font-size: 42px;
            }

            .intro {
                font-size: 18px;
            }

            .card,
            .prediction {
                padding: 30px 25px;
            }

            .row {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>


<body>

<div class="main">

    <div class="subtitle">
        Complaint intake & triage — demo
    </div>


    <h1>
        Cybercrime Complaint<br>
        Prediction
    </h1>


    <p class="intro">
        Enter complaint details to estimate category,
        severity and likely resolution time. This demo
        runs a rule-based model in the browser.
    </p>


    <hr class="line">


    <!-- NEW COMPLAINT -->

    <div class="card">

        <h2>New complaint</h2>


        <!-- Complaint Type -->

        <div class="field">

            <label>Complaint type</label>

            <select id="complaintType">

                <option>UPI / Payment fraud</option>

                <option>Online Banking Fraud</option>

                <option>ATM / Cash Withdrawal Fraud</option>

                <option>Credit / Debit Card Fraud</option>

                <option>Phishing</option>

                <option>Social Media Fraud</option>

                <option>Identity Theft</option>

                <option>Other Cybercrime</option>

            </select>

        </div>


        <!-- Description -->

        <div class="field">

            <label>Description</label>

            <textarea
                id="description"
                placeholder="Briefly describe what happened — e.g. received a call claiming to be from the bank asking for OTP...">
            </textarea>

        </div>


        <!-- Amount + Contact Mode -->

        <div class="row">

            <div class="field">

                <label>Amount involved (₹)</label>

                <input
                    type="number"
                    id="amount"
                    value="0"
                    placeholder="0">

            </div>


            <div class="field">

                <label>Contact mode</label>

                <select id="contactMode">

                    <option>Phone call</option>

                    <option>SMS</option>

                    <option>Email</option>

                    <option>WhatsApp</option>

                    <option>Social Media</option>

                    <option>Website</option>

                </select>

            </div>

        </div>


        <!-- State -->

        <div class="field">

            <label>State / UT</label>

            <input
                type="text"
                id="state"
                placeholder="e.g. Tamil Nadu">

        </div>


        <!-- Predict Button -->

        <button
            class="predict-btn"
            onclick="predictOutcome()">

            Predict outcome

        </button>

    </div>


    <!-- PREDICTION -->

    <div class="prediction">

        <h2>Prediction</h2>

        <p id="result">
            Fill the form and press Predict to see the
            model's estimate here.
        </p>

    </div>

</div>


<!-- ============================= -->
<!-- BACKEND CONNECTION SCRIPT -->
<!-- ============================= -->

<script>

async function predictOutcome() {

    const complaintType =
        document.getElementById("complaintType").value;

    const description =
        document.getElementById("description").value;

    const amount =
        document.getElementById("amount").value;

    const contactMode =
        document.getElementById("contactMode").value;

    const state =
        document.getElementById("state").value;


    // Check description

    if (description.trim() === "") {

        document.getElementById("result").innerHTML =
            "<div class='result-box'>" +
            "Please enter complaint description." +
            "</div>";

        return;
    }


    try {

        // Send data to Flask backend

        const response = await fetch(
            "http://127.0.0.1:5000/predict",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    complaintType: complaintType,

                    description: description,

                    amount: amount,

                    contactMode: contactMode,

                    state: state

                })

            }
        );


        // Get response

        const data = await response.json();


        // Display prediction

        document.getElementById("result").innerHTML =

            "<div class='result-box'>" +

            "<b>Predicted Category:</b> " +
            data.category +

            "<br><br>" +

            "<b>Severity:</b> " +
            data.severity +

            "<br><br>" +

            "<b>Estimated Resolution Time:</b> " +
            data.resolution_time +

            "<br><br>" +

            "<b>Contact Mode:</b> " +
            data.contact_mode +

            "<br><br>" +

            "<b>State / UT:</b> " +
            data.state +

            "</div>";

    }


    catch (error) {

        document.getElementById("result").innerHTML =

            "<div class='result-box'>" +

            "Backend connection error! " +
            "Please start the Flask server." +

            "</div>";

        console.error(error);

    }

}

</script>


</body>

</html>
